# MHA iOS — Home Assistant theme
# Pure design layer: radius, borders, typography, spacing, animation,
# shadows, layout, and Web Awesome geometry.
# Colors (legacy, semantic, state, MDC, etc.) belong to Catppuccin.

MHA iOS:
  # =========================================================================
  # HA Core Design Tokens
  # =========================================================================

  # -- Border radius --------------------------------------------------------
  ha-border-radius-sm: 8px
  ha-border-radius-md: 12px
  ha-border-radius-lg: 16px
  ha-border-radius-xl: 20px
  ha-border-radius-2xl: 24px
  ha-border-radius-3xl: 28px
  ha-border-radius-4xl: 32px
  ha-border-radius-5xl: 36px
  ha-border-radius-6xl: 40px
  ha-border-radius-pill: 9999px
  ha-border-radius-circle: 50%
  ha-border-radius-square: 0px

  # -- Border width ---------------------------------------------------------
  ha-border-width-sm: 0.5px
  ha-border-width-md: 1px
  ha-border-width-lg: 1.5px

  # -- Typography -----------------------------------------------------------
  ha-font-family-body: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif"
  ha-font-family-heading: "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif"
  ha-font-family-code: "'SF Mono', 'Fira Code', 'Fira Mono', Menlo, Consolas, 'Liberation Mono', monospace"
  ha-font-family-longform: "Georgia, 'Times New Roman', serif"

  ha-font-weight-light: 300
  ha-font-weight-normal: 400
  ha-font-weight-medium: 500
  ha-font-weight-bold: 700
  ha-font-weight-body: 400
  ha-font-weight-heading: 600
  ha-font-weight-action: 500

  ha-font-size-scale: 1
  ha-font-size-xs: 11px
  ha-font-size-s: 13px
  ha-font-size-m: 15px
  ha-font-size-l: 17px
  ha-font-size-xl: 20px
  ha-font-size-2xl: 24px
  ha-font-size-3xl: 28px
  ha-font-size-4xl: 34px
  ha-font-size-5xl: 40px

  ha-line-height-condensed: 1.2
  ha-line-height-normal: 1.5
  ha-line-height-expanded: 1.8

  ha-font-smoothing: antialiased
  ha-moz-osx-font-smoothing: grayscale

  # -- Spacing --------------------------------------------------------------
  ha-space-1: 4px
  ha-space-2: 8px
  ha-space-3: 12px
  ha-space-4: 16px
  ha-space-5: 20px
  ha-space-6: 24px
  ha-space-7: 28px
  ha-space-8: 32px
  ha-space-9: 36px
  ha-space-10: 40px
  ha-space-11: 44px
  ha-space-12: 48px
  ha-space-13: 52px
  ha-space-14: 56px
  ha-space-15: 60px
  ha-space-16: 64px
  ha-space-17: 68px
  ha-space-18: 72px
  ha-space-19: 76px
  ha-space-20: 80px

  # -- Animation ------------------------------------------------------------
  ha-animation-duration-none: 0ms
  ha-animation-duration-instant: 1ms
  ha-animation-duration-fast: 75ms
  ha-animation-duration-normal: 200ms
  ha-animation-duration-slow: 350ms

  # -- Elevation / shadows --------------------------------------------------
  ha-box-shadow-s: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.08)
  ha-box-shadow-m: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.06)
  ha-box-shadow-l: 0 12px 32px rgba(0,0,0,0.12), 0 4px 8px rgba(0,0,0,0.08)

  # =========================================================================
  # Native Chrome — layout / header / dialog
  # =========================================================================
  header-height: 56px
  app-header-border-bottom: "1px solid rgba(0,0,0,0.06)"
  ha-dialog-scrim-backdrop-filter: "blur(30px) saturate(1.5)"

  # =========================================================================
  # MHA Glass — custom tokens consumed by card-mod CSS
  # =========================================================================
  mha-glass-filter: "blur(24px) saturate(1.45)"
  mha-glass-dialog-filter: "blur(30px) saturate(1.5)"
  mha-glass-header-filter: "blur(20px) saturate(1.35)"
  mha-glass-sidebar-filter: "blur(32px) saturate(1.5)"
  mha-glass-tint: "rgba(255,255,255,0.10)"
  mha-glass-dialog-tint: "rgba(255,255,255,0.16)"
  mha-glass-sidebar-tint: "rgba(242,242,247,0.30)"
  mha-glass-border: "rgba(255,255,255,0.22)"
  mha-glass-inset: "0 1px 0 rgba(255,255,255,0.18) inset"
  ha-dialog-surface-backdrop-filter: "var(--mha-glass-dialog-filter)"
  app-header-backdrop-filter: "var(--mha-glass-header-filter)"

  # =========================================================================
  # Web Awesome — design tokens
  # =========================================================================
  wa-space-xs: 4px
  wa-space-m: 16px
  wa-space-l: 24px
  wa-space-xl: 32px

  wa-font-weight-action: 500
  wa-font-weight-body: 400

  wa-transition-normal: 200ms
  wa-transition-fast: 75ms
  wa-transition-easing: cubic-bezier(0.4, 0, 0.2, 1)

  wa-border-style: solid
  wa-border-width-s: 0.5px
  wa-border-width-m: 1px
  wa-border-width-l: 1.5px

  wa-border-radius-s: 8px
  wa-border-radius-m: 12px
  wa-border-radius-l: 16px
  wa-border-radius-pill: 9999px

  wa-line-height-condensed: 1.2

  wa-font-size-s: 13px
  wa-font-size-m: 15px
  wa-font-size-l: 17px

  wa-shadow-s: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.08)
  wa-shadow-m: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.06)
  wa-shadow-l: 0 12px 32px rgba(0,0,0,0.12), 0 4px 8px rgba(0,0,0,0.08)

  wa-panel-border-radius: var(--ha-border-radius-3xl)
  wa-panel-border-style: solid
  wa-panel-border-width: 1px

  # =========================================================================
  # Wallpaper
  # =========================================================================
  lovelace-background: "center / cover no-repeat fixed url('https://raw.githubusercontent.com/jingle-jew/mha-ios-theme/main/wallpaper-light.svg')"

  # =========================================================================
  # card-mod CSS — frosted glass system
  # =========================================================================
  card-mod-theme: "MHA iOS"

  card-mod-root: |
    :host {
      --ha-card-backdrop-filter: var(--mha-glass-filter);
      --ha-card-background: transparent;
      --ha-card-box-shadow: 0 12px 30px rgba(34,48,78,0.09), var(--mha-glass-inset);
      --ha-card-border-width: 1px;
      --ha-card-border-color: var(--mha-glass-border);
    }

    ha-app-layout,
    div#view {
      background: var(--lovelace-background) !important;
      background-size: cover !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
      background-attachment: fixed !important;
    }

    app-header,
    app-toolbar,
    div.header,
    div.toolbar {
      background: transparent !important;
    }

    .mdc-drawer .mdc-drawer__content {
      background: var(--mha-glass-sidebar-tint) !important;
      backdrop-filter: var(--mha-glass-sidebar-filter) !important;
      -webkit-backdrop-filter: var(--mha-glass-sidebar-filter) !important;
    }

    ha-label-badge {
      backdrop-filter: var(--mha-glass-filter) !important;
      -webkit-backdrop-filter: var(--mha-glass-filter) !important;
    }

  card-mod-view: |
    hui-view {
      background: none !important;
    }

  card-mod-card: |
    ha-card {
      position: relative;
      overflow: hidden;
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    ha-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--mha-glass-tint);
      backdrop-filter: var(--mha-glass-filter);
      -webkit-backdrop-filter: var(--mha-glass-filter);
      border-radius: inherit;
      box-shadow: var(--mha-glass-inset);
      pointer-events: none;
      z-index: -1;
    }

    :host(hui-heading-card) ha-card::before,
    :host(mushroom-title-card) ha-card::before,
    :host(.type-custom-bubble-card) ha-card::before,
    :host(mushroom-chips-card) ha-card::before {
      content: none !important;
    }

    :host(hui-heading-card) ha-card,
    :host(mushroom-title-card) ha-card,
    :host(.type-custom-bubble-card) ha-card,
    :host(mushroom-chips-card) ha-card {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
    }

  # =========================================================================
  # Light / Dark mode — structural overrides only
  # =========================================================================
  modes:
    light:
      lovelace-background: "center / cover no-repeat fixed url('https://raw.githubusercontent.com/jingle-jew/mha-ios-theme/main/wallpaper-light.svg')"
    dark:
      ha-box-shadow-s: 0 1px 3px rgba(0,0,0,0.24), 0 1px 2px rgba(0,0,0,0.32)
      ha-box-shadow-m: 0 4px 12px rgba(0,0,0,0.32), 0 2px 4px rgba(0,0,0,0.24)
      ha-box-shadow-l: 0 16px 40px rgba(0,0,0,0.40), 0 4px 8px rgba(0,0,0,0.28)
      app-header-border-bottom: "1px solid rgba(255,255,255,0.08)"
      mha-glass-tint: "rgba(255,255,255,0.075)"
      mha-glass-dialog-tint: "rgba(44,44,46,0.38)"
      mha-glass-sidebar-tint: "rgba(20,22,30,0.42)"
      mha-glass-border: "rgba(235,243,255,0.20)"
      mha-glass-inset: "0 1px 0 rgba(255,255,255,0.14) inset"
      wa-shadow-s: 0 1px 3px rgba(0,0,0,0.24), 0 1px 2px rgba(0,0,0,0.32)
      wa-shadow-m: 0 4px 12px rgba(0,0,0,0.32), 0 2px 4px rgba(0,0,0,0.24)
      wa-shadow-l: 0 16px 40px rgba(0,0,0,0.40), 0 4px 8px rgba(0,0,0,0.28)
      lovelace-background: "center / cover no-repeat fixed url('https://raw.githubusercontent.com/jingle-jew/mha-ios-theme/main/wallpaper-dark.svg')"

# MHA iOS — Home Assistant theme
# Inspired by the MHA Widget Hub iOS visual system.
# Native HA themes can reproduce the palette, surfaces, typography, borders,
# shadows and light/dark modes. Arbitrary blur/noise/reflection effects require
# dashboard/card CSS and are intentionally not faked here.

MHA iOS:
  primary-color: "#5b8cff"
  accent-color: "#5b8cff"
  primary-background-color: "#d7e0f2"
  secondary-background-color: "#c5d2ea"
  card-background-color: "rgba(255,255,255,0.32)"
  primary-text-color: "rgba(0,0,0,0.92)"
  secondary-text-color: "rgba(0,0,0,0.55)"
  disabled-text-color: "rgba(0,0,0,0.32)"

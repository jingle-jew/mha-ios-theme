# MHA iOS — Home Assistant theme
# Native Home Assistant theme inspired by the MHA Widget Hub iOS visual system.
# Wallpaper assets are standalone SVG files hosted in this HACS repository.

MHA iOS:
  card-mod-theme: "MHA iOS"
  primary-color: "#5b8cff"
  accent-color: "#5b8cff"
  primary-background-color: "#d7e0f2"
  secondary-background-color: "#c5d2ea"
  card-background-color: "rgba(255,255,255,0.32)"
  primary-text-color: "rgba(0,0,0,0.92)"
  secondary-text-color: "rgba(0,0,0,0.55)"
  disabled-text-color: "rgba(0,0,0,0.32)"
  ha-card-background: "rgba(255,255,255,0.32)"
  ha-card-border-radius: "24px"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(255,255,255,0.54)"
  ha-card-box-shadow: "0 12px 30px rgba(34,48,78,0.09), inset 0 1px 0 rgba(255,255,255,0.54)"
  app-header-background-color: "rgba(255,255,255,0.24)"
  app-header-text-color: "rgba(0,0,0,0.92)"
  sidebar-background-color: "rgba(242,242,247,0.72)"
  sidebar-text-color: "rgba(0,0,0,0.78)"
  sidebar-selected-background-color: "rgba(255,255,255,0.54)"
  sidebar-selected-icon-color: "#5b8cff"
  sidebar-icon-color: "rgba(0,0,0,0.55)"
  sidebar-selected-text-color: "rgba(0,0,0,0.92)"

  mha-glass-filter: "blur(24px) saturate(1.45)"
  mha-glass-dialog-filter: "blur(30px) saturate(1.5)"
  mha-glass-header-filter: "blur(20px) saturate(1.35)"
  mha-glass-sidebar-filter: "blur(32px) saturate(1.5)"
  mha-glass-tint: "rgba(255,255,255,0.10)"
  mha-glass-dialog-tint: "rgba(255,255,255,0.16)"
  mha-glass-sidebar-tint: "rgba(242,242,247,0.30)"
  mha-glass-border: "rgba(255,255,255,0.22)"
  mha-glass-inset: "0 1px 0 rgba(255,255,255,0.18) inset"
  ha-dialog-surface-backdrop-filter: "var(--mha-glass-dialog-filter)"
  app-header-backdrop-filter: "var(--mha-glass-header-filter)"

  card-mod-root: |
    :host {
      --ha-card-backdrop-filter: var(--mha-glass-filter);
      --ha-card-background: transparent;
      --ha-card-box-shadow: 0 12px 30px rgba(34,48,78,0.09), var(--mha-glass-inset);
      --ha-card-border-width: 1px;
      --ha-card-border-color: var(--mha-glass-border);
    }

    ha-app-layout,
    div#view {
      background: var(--lovelace-background) !important;
      background-size: cover !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
      background-attachment: fixed !important;
    }

    app-header,
    app-toolbar,
    div.header,
    div.toolbar {
      background: transparent !important;
    }

    .mdc-drawer .mdc-drawer__content {
      background: var(--mha-glass-sidebar-tint) !important;
      backdrop-filter: var(--mha-glass-sidebar-filter) !important;
      -webkit-backdrop-filter: var(--mha-glass-sidebar-filter) !important;
    }

    ha-label-badge {
      backdrop-filter: var(--mha-glass-filter) !important;
      -webkit-backdrop-filter: var(--mha-glass-filter) !important;
    }

  card-mod-view: |
    hui-view {
      background: none !important;
    }

  card-mod-card: |
    ha-card {
      position: relative;
      overflow: hidden;
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    ha-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--mha-glass-tint);
      backdrop-filter: var(--mha-glass-filter);
      -webkit-backdrop-filter: var(--mha-glass-filter);
      border-radius: inherit;
      box-shadow: var(--mha-glass-inset);
      pointer-events: none;
      z-index: -1;
    }

    :host(hui-heading-card) ha-card::before,
    :host(mushroom-title-card) ha-card::before,
    :host(.type-custom-bubble-card) ha-card::before,
    :host(mushroom-chips-card) ha-card::before {
      content: none !important;
    }

    :host(hui-heading-card) ha-card,
    :host(mushroom-title-card) ha-card,
    :host(.type-custom-bubble-card) ha-card,
    :host(mushroom-chips-card) ha-card {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
    }

  input-background-color: "rgba(255,255,255,0.18)"
  input-fill-color: "rgba(255,255,255,0.18)"
  input-ink-color: "rgba(0,0,0,0.92)"
  input-label-ink-color: "rgba(0,0,0,0.55)"
  divider-color: "rgba(0,0,0,0.08)"
  scrollbar-thumb-color: "rgba(0,0,0,0.20)"
  scrollbar-track-color: "transparent"
  table-row-background-color: "transparent"
  table-row-alternative-background-color: "rgba(255,255,255,0.12)"
  paper-dialog-background-color: "rgba(242,242,247,0.88)"
  paper-menu-background-color: "rgba(242,242,247,0.92)"
  paper-listbox-background-color: "transparent"
  mdc-dialog-container-color: "rgba(242,242,247,0.92)"
  mdc-menu-surface-container-color: "rgba(242,242,247,0.92)"
  mdc-text-field-fill-color: "rgba(255,255,255,0.30)"
  state-active-color: "#5b8cff"
  state-inactive-color: "rgba(0,0,0,0.38)"
  state-cover-open-color: "#ff9f0a"
  state-light-active-color: "#ffcc00"
  state-switch-active-color: "#34c759"
  state-media_player-active-color: "#5b8cff"
  state-person-home-color: "#34c759"
  state-person-not_home-color: "rgba(0,0,0,0.38)"

  primary-font-family: "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', sans-serif"
  paper-font-common-base_-_font-family: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif"

